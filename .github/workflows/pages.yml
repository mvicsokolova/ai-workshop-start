# The Skill Atlas of JetBrains/intellij-community on GitHub Pages: exported on every push to main,
# every day for new skills, and on demand; published as the gh-pages branch, which Pages serves.
name: Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPOSITORY: https://github.com/JetBrains/intellij-community
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The workflow's token: GitHub's higher rate limit, and code search.
      - run: ./skill-atlas export "$REPOSITORY" _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # One commit, the site alone: the branch holds the latest export, not a history of them.
      - name: Publish to gh-pages
        working-directory: _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Skill Atlas of $REPOSITORY, from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
