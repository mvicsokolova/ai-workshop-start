# Automated code review: Claude reviews each pull request with the code-review skill
# (.claude/skills/code-review/SKILL.md) and comments on it. Advisory only: CI is the merge gate.
# Needs the ANTHROPIC_API_KEY repository secret. Pull requests from forks get no secrets and are skipped.
name: Code review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
permissions:
  contents: read
  pull-requests: write
  id-token: write
concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the base branch too, for git diff origin/main...HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # So the review can run the typecheck and the tests, as the skill asks.
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Pull requests opened by agents such as jetbrains-air are reviewed too.
          allowed_bots: '*'
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Follow .claude/skills/code-review/SKILL.md exactly.
            Post each finding as an inline comment on the line it is about, then one top-level
            comment with the summary ranked by severity. If there is nothing to report, say so.
            Do not change any files.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(npm test),Bash(npm run typecheck),Bash(./skill-atlas:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
